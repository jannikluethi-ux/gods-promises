<!DOCTYPE html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Search a comprehensive catalog of God’s promises (WEB) from Genesis through Revelation by feeling, theme, keyword, or book."
    />
    <title>God’s Promises — Searchable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=daily-1" />
  </head>
  <body class="page-home is-landing">
    <a class="skip-link" href="#results">Skip to results</a>

    <header class="site-header site-header--bar">
      <div class="header-bar">
        <a class="brand-link" href="index.html">God’s Promises</a>
        <nav class="site-nav js-auth-nav" aria-label="Account"></nav>
      </div>
    </header>

    <main class="wrap">
      <section class="search-panel" aria-label="Search and filters">
        <p class="hero-wordmark" aria-hidden="true">God’s Promises</p>
        <label class="search-label sr-only" for="search">Search promises</label>
        <form class="search-row search-bar" id="search-form" role="search">
          <input
            id="search"
            type="search"
            name="q"
            placeholder="How are you feeling, or search by theme, keyword, verse…"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            autofocus
          />
          <div class="search-bar-actions">
            <button
              type="button"
              class="filters-toggle"
              id="filters-toggle"
              aria-expanded="false"
              aria-controls="filters-panel"
              aria-label="Filters"
              title="Filters"
            >
              <svg class="filters-toggle-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false">
                <path d="M3 6h9M15 6h2M3 14h3M9 14h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="13.5" cy="6" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5" />
                <circle cx="7.5" cy="14" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5" />
              </svg>
              <span class="filters-toggle-badge" id="filters-badge" hidden aria-hidden="true"></span>
            </button>
            <button type="submit" class="search-submit" id="search-submit">Search</button>
          </div>
        </form>

        <div class="filters filters-dropdowns" id="filters-panel" hidden>
          <div class="filter-block filter-block-testament">
            <h2 id="testament-heading">Testament</h2>
            <div
              id="testament-options"
              class="testament-options"
              role="group"
              aria-labelledby="testament-heading"
            >
              <button type="button" class="testament-btn" data-testament="" aria-pressed="true">
                All
              </button>
              <button type="button" class="testament-btn" data-testament="OT" aria-pressed="false">
                Old Testament
              </button>
              <button type="button" class="testament-btn" data-testament="NT" aria-pressed="false">
                New Testament
              </button>
            </div>
          </div>

          <div class="filter-block">
            <h2 id="feeling-heading">Feeling</h2>
            <div class="select-row">
              <label class="sr-only" for="feeling-filter">Filter by feeling</label>
              <select id="feeling-filter" aria-labelledby="feeling-heading">
                <option value="">All feelings</option>
              </select>
            </div>
          </div>

          <div class="filter-block">
            <h2 id="theme-heading">Theme</h2>
            <div class="select-row">
              <label class="sr-only" for="theme-filter">Filter by theme</label>
              <select id="theme-filter" aria-labelledby="theme-heading">
                <option value="">All themes</option>
              </select>
            </div>
          </div>

          <div class="filter-block">
            <h2 id="book-heading">Book</h2>
            <div class="select-row">
              <label class="sr-only" for="book-filter">Filter by book</label>
              <select id="book-filter" aria-labelledby="book-heading">
                <option value="">All books</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <div class="results-meta" id="results-meta" aria-live="polite">
        <span id="result-count"></span>
        <span>WEB · public domain</span>
      </div>

      <section id="results" aria-label="Search results"></section>

      <div id="smart-guide" class="smart-guide" hidden aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <p>
        Scripture text: World English Bible (WEB), public domain. Paraphrases are
        plain-language summaries for search—not additional Bible wording.
      </p>
      <p>Made for Carlos · Extend via <code>promises.json</code></p>
    </footer>

    <script src="promises-data.js?v=wixstyle-1"></script>
    <script src="js/config.js?v=wixstyle-1"></script>
    <script src="js/subscription.js?v=wixstyle-1"></script>
    <script src="js/auth.js?v=wixstyle-1"></script>
    <script src="js/favorites.js?v=wixstyle-1"></script>
    <script src="js/ui-shared.js?v=wixstyle-1"></script>
    <script src="js/smart-search.js?v=wixstyle-1"></script>
    <script src="js/relevance.js?v=wixstyle-1"></script>
    <script src="app.js?v=daily-1"></script>
  </body>
</html>
