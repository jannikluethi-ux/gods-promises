name: Static SEO and privacy checks
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/analytics.test.js
      - run: node tests/safe-next.test.js
      - run: node tests/feedback-api.test.js
      - run: node tests/feedback-widget.test.js
